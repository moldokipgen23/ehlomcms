name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/moldokipgen23/ehlomcms:latest
            ghcr.io/moldokipgen23/ehlomcms:${{ github.sha }}

      # Tells Bunny Magic Containers to deploy the freshly built image.
      # Uses the unique commit SHA as the tag so Bunny always pulls a new
      # image — no stale cache, nothing to change manually on any deploy.
      - name: Deploy to Bunny Magic Containers
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ secrets.BUNNY_APP_ID }}
          api_key: ${{ secrets.BUNNY_API_KEY }}
          container: app
          image_tag: ${{ github.sha }}
